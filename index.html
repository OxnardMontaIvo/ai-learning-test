<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой список задач</title>
  <style>
    /* CSS отвечает за внешний вид страницы. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #202633;
    }
    main {
      max-width: 620px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
    }
    h1 { margin-top: 0; }
    .hint { color: #606b7b; line-height: 1.5; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #cbd2dc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }
    .add { background: #245bd6; color: white; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid #e6e9ef;
    }
    li span { flex: 1; overflow-wrap: anywhere; }
    li.done span { color: #778091; text-decoration: line-through; }
    .delete { background: #fce8e8; color: #9b2525; }
    #empty { color: #778091; padding: 12px 0; }
    @media (max-width: 420px) {
      main { padding: 18px; }
      form { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Мой список задач</h1>
    <p class="hint">Добавляй дела, отмечай выполненные и удаляй то, что больше не нужно. Список сохраняется в этом браузере.</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Чем я могу помочь?" aria-label="Новая задача" maxlength="200" required>
      <button class="add" type="submit">Добавить</button>
    </form>

    <p id="empty">Пока задач нет. Добавь первую!</p>
    <ul id="task-list"></ul>
  </main>

  <script>
    // JavaScript отвечает за поведение приложения.
    const form = document.querySelector("#task-form");
    const input = document.querySelector("#task-input");
    const list = document.querySelector("#task-list");
    const emptyMessage = document.querySelector("#empty");

    // localStorage хранит список в браузере даже после перезагрузки страницы.
    let tasks = [];
    try {
      tasks = JSON.parse(localStorage.getItem("myTasks") || "[]");
      if (!Array.isArray(tasks)) tasks = [];
    } catch {
      tasks = [];
    }

    function saveTasks() {
      localStorage.setItem("myTasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      list.replaceChildren();

      tasks.forEach((task) => {
        const item = document.createElement("li");
        if (task.done) item.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", "Отметить задачу выполненной");
        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        // textContent показывает введённый текст как текст, а не как HTML-код.
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete";
        deleteButton.textContent = "Удалить";
        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter((item) => item.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, deleteButton);
        list.append(item);
      });

      emptyMessage.hidden = tasks.length > 0;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault(); // Не даём странице перезагрузиться при отправке формы.
      const text = input.value.trim();
      if (!text) return;

      tasks.push({
        id: Date.now(),
        text: text,
        done: false
      });

      saveTasks();
      renderTasks();
      input.value = "";
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
